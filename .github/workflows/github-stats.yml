name: Update GitHub Stats

on:
  schedule:
    - cron: "15 0 * * *"
  push:
    paths:
      - ".github/workflows/github-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&rank_icon=github&include_all_commits=true&theme=github_dark
          path: profile/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify stats card
        run: test -s profile/github-stats.svg

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/github-stats.svg
          if git diff --cached --quiet; then
            echo "No stats changes"
            exit 0
          fi
          git commit -m "chore: update GitHub stats"
          git push
